<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Puisi Stateful</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>

    <header class="navbar">

        <div class="logo">

            <h1>Puisi Stateful</h1>

            <p>
                Ruang untuk menulis dan menyimpan karya.
            </p>

        </div>

    </header>

    <main class="container">

        <section class="page-section">

            <div class="card auth-card">

                <a
                    href="../index.html"
                    class="back-button">

                    ← Kembali

                </a>

                <div class="section-title">

                    <span class="small-label">
                        PUISI STATEFUL
                    </span>

                    <h2>
                        Buat Akun
                    </h2>

                    <p>
                        Daftar terlebih dahulu untuk
                        mulai menyimpan puisi.
                    </p>

                </div>

                <form id="registerForm">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Buat username"
                            autocomplete="username"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="nama">
                            Nama Lengkap
                        </label>

                        <input
                            type="text"
                            id="nama"
                            name="nama"
                            placeholder="Masukkan nama lengkap"
                            autocomplete="name"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Buat password"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary full-button">

                        Register

                    </button>


                </form>

                <div
                    id="registerMessage"
                    class="message">
                </div>

                <p class="switch-auth">

                    Sudah memiliki akun?

                    <a
                        href="../login/login.html"
                        class="link-button">

                        Login

                    </a>

                </p>


            </div>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Puisi Stateful
        </p>

        <p>
            PHP Native · MySQL · Server-Side Session
        </p>

    </footer>


    <script src="register.js"></script>

</body>

</html>
