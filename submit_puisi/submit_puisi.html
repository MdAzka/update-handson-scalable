<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tulis Puisi - Puisi Stateful</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>


    <header class="navbar">

        <div class="logo">

            <h1>Puisi Stateful</h1>

            <p>
                Ruang untuk menulis dan menyimpan karya.
            </p>

        </div>

    </header>

    <main class="container">

        <section class="page-section">


            <div class="card auth-card">


                <a
                    href="../index.html"
                    class="back-button">

                    ← Kembali ke Dashboard

                </a>

                <div class="section-title">

                    <span class="small-label">
                        PUISI STATEFUL
                    </span>

                    <h2>
                        Tulis Puisi
                    </h2>

                    <p>
                        Tuangkan pikiran dan perasaanmu
                        dalam sebuah karya.
                    </p>

                </div>

                <form id="puisiForm">


                    <div class="form-group">

                        <label for="judul">
                            Judul Puisi
                        </label>

                        <input
                            type="text"
                            id="judul"
                            name="judul"
                            placeholder="Masukkan judul puisi"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="kategori">
                            Kategori
                        </label>

                        <input
                            type="text"
                            id="kategori"
                            name="kategori"
                            placeholder="Contoh: Romantis, Kehidupan, Alam"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="keyword">
                            Keyword
                        </label>

                        <input
                            type="text"
                            id="keyword"
                            name="keyword"
                            placeholder="Contoh: cinta, senja, rindu"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="isi">
                            Isi Puisi
                        </label>

                        <textarea
                            id="isi"
                            name="isi"
                            rows="12"
                            placeholder="Tuliskan puisimu di sini..."
                            required
                        ></textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary full-button">

                        Simpan Puisi

                    </button>


                </form>

                <div
                    id="puisiMessage"
                    class="message">
                </div>


            </div>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Puisi Stateful
        </p>

        <p>
            PHP Native · MySQL · Server-Side Session
        </p>

    </footer>

    <script src="submit_puisi.js"></script>

</body>

</html>
