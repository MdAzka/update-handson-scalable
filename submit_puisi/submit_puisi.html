<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tulis Puisi - Puisi Stateful</title>

    <link rel="stylesheet" href="../style.css" />
  </head>

  <body>
    <header class="navbar">
      <div class="logo">
        <h1>Puisi Stateful</h1>

        <p>Ruang untuk menulis dan menyimpan karya.</p>
      </div>
    </header>

    <main class="container">
      <section class="page-section">
        <div class="card auth-card">
          <a href="../index.html" class="back-button">
            ← Kembali ke Dashboard
          </a>

          <div class="section-title">
            <span class="small-label"> PUISI STATEFUL </span>

            <h2>Tulis Puisi</h2>

            <p>Tuangkan pikiran dan perasaanmu dalam sebuah karya.</p>
          </div>

          <form id="puisiForm">
            <div class="form-group">
              <label for="judul"> Judul Puisi </label>

              <input
                type="text"
                id="judul"
                name="judul"
                placeholder="Masukkan judul puisi"
                required
              />
            </div>

            <div class="form-group">
              <label for="kategori"> Kategori </label>

              <input
                type="text"
                id="kategori"
                name="kategori"
                placeholder="Contoh: Romantis, Kehidupan, Alam"
                required
              />
            </div>

            <div class="form-group">
              <label for="keyword"> Keyword </label>

              <input
                type="text"
                id="keyword"
                name="keyword"
                placeholder="Contoh: cinta, senja, rindu"
                required
              />
            </div>

            <div class="form-group">
              <label for="isi"> Isi Puisi </label>

              <textarea
                id="isi"
                name="isi"
                rows="12"
                placeholder="Tuliskan puisimu di sini..."
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label for="bait">Bait Puisi (untuk gambar)</label>
              <textarea
                id="bait"
                name="bait"
                rows="3"
                placeholder="Potongan bait yang akan tampil di gambar"
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label>Pilih Template Gambar</label>
              <div class="template-choices">
                <label
                  ><input type="radio" name="template" value="latar1" checked />
                  Template 1</label
                >
                <label
                  ><input type="radio" name="template" value="latar2" />
                  Template 2</label
                >
                <label
                  ><input type="radio" name="template" value="latar3" />
                  Template 3</label
                >
                <label
                  ><input type="radio" name="template" value="latar5" />
                  Template 4</label
                >
              </div>
            </div>

            <div class="form-group">
              <label>Preview Gambar Puisi</label>
              <img
                id="previewImage"
                src=""
                alt="Preview"
                style="max-width: 100%; border: 1px solid #ccc"
              />
            </div>

            <button type="submit" class="btn btn-primary full-button">
              Simpan Puisi
            </button>
          </form>

          <div id="puisiMessage" class="message"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 Puisi Stateful</p>

      <p>PHP Native · MySQL · Server-Side Session</p>
    </footer>

    <script src="submit_puisi.js"></script>
  </body>
</html>
